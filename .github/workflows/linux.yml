name: Linux x86-64

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            compiler: gcc
            build_type: Debug
            sanitizers: "OFF"
          - name: GCC Release
            compiler: gcc
            build_type: Release
            sanitizers: "OFF"
          - name: Clang ASan/UBSan
            compiler: clang
            build_type: Debug
            sanitizers: "ON"
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out independent source tree
        # actions/checkout v4.3.1; pin the exact action revision.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake libreadline-dev python3
      - name: Configure
        run: |
          test "$(uname -m)" = x86_64
          cmake -S . -B build-ci \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DSIM4000_REQUIRE_PYTHON_TESTS=ON \
            -DSIM4000_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Run all integration checkpoints
        # Keep tests serial: throttle checks measure real elapsed/CPU time.
        run: ctest --test-dir build-ci --parallel 1 --output-on-failure
      - name: Verify source fixtures remain unchanged
        if: always()
        run: git diff --exit-code

# Verification only: do not upload or publish executables or historical media.
