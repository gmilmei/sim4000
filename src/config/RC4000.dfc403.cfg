; Optional historical DFC403/RC4819 hardware-interface configuration.
; STDMON is supplied ready to run, including the RC610 printer.
; Then run in that build directory: ./sim4000 -a -c RC4000.dfc403.cfg
; The default RC4000.cfg continues to use the simplified RC433X interface.
; Paths are relative to this configuration file. See RC4000.cfg for detailed
; keyboard, terminal, date, and host-file option descriptions.
CORESIZE=0,1048576

; Optional opcode-61 index instruction, needed by catstat, not a full RC8000 CPU.
; Enabled by default for supplied software; --ix and --no-ix override it.
CPU IX=YES
; CPU IX=NO
MONITOR FILE=STDMON
OPERATOR ESCAPE=CTRL-E
OPERATOR DATE=ALT-D
INPUT DEL=CTRL-H
DATE YEAROFFSET=-40
; See RC4000.cfg for pacing modes; applies only to interactive execution.
THROTTLE VALUE=50%
; THROTTLE VALUE=ORIGINAL
; THROTTLE VALUE=250000IPS
; THROTTLE VALUE=OFF
DEFINE CONSOLE DEVNO=2 INTNO=6,3
DEFINE CLOCK DEVNO=3 INTNO=11
; Automatic append-only printer output, separate from the native profile.
DEFINE RC610 DEVNO=7 INTNO=10 FILE=printer.dfc403.txt APPEND=YES
DEFINE CONSOLE DEVNO=4 INTNO=20,19
; TELNET DEVNO=4 ADDRESS=127.0.0.1 PORT=4004 ATTENTION=CTRL-A
DEFINE READER DEVNO=0 INTNO=9
DEFINE PUNCH DEVNO=1 INTNO=12
DEFINE DFC403 DEVNO=15 INTNO=23,22
; Declare the controller before its drives. A unit is identified by DFC and
; UNITNO, not DEVNO. Images use volatile copy-on-write; base files never change.
DEFINE RC4819 DFC=15 UNITNO=0 FILE=UNIT0
; Optional fixed-capacity scratch drive (1..406 cylinders, initially zero).
; DEFINE RC4819RAM DFC=15 UNITNO=1 CYLS=16
DEFINE HOSTFILES DEVNO=63 INTNO=21 ROOT=exchange
