; MIPS/TS autostart profile: compatibility monitor, IX on, protection off.
; Paths are relative to this configuration. Keep both disks together.
; UNIT0.mipsts starts TEM, PRIMO and SOS and mounts UNIT1.mipsts as disc1.
; Boot date is fixed to 30 September 1986; no date prompt is presented.
PROTECTION MODE=OFF
CPU IX=YES
CORESIZE=0,1048576
MONITOR FILE=MONITOR

; Local emulator CLI, date insertion and modern Backspace translation.
OPERATOR ESCAPE=CTRL-E
OPERATOR DATE=ALT-D
INPUT DEL=CTRL-H
DATE YEAROFFSET=-40
THROTTLE VALUE=50%
; THROTTLE VALUE=ORIGINAL
; THROTTLE VALUE=OFF

DEFINE CONSOLE DEVNO=2 INTNO=6,3 PROTOCOL=CLASSIC
DEFINE CLOCK DEVNO=3 INTNO=11
; Automatic RC610 output, appending across restarts without truncation.
; PRIMO can use printer/kind 14; see the manual's administrative print recipe.
DEFINE RC610 DEVNO=7 INTNO=10 FILE=printer.mipsts.txt APPEND=YES
DEFINE CONSOLE DEVNO=4 INTNO=20,19 PROTOCOL=CLASSIC
; Loopback only. Telnet is unencrypted; dummy account/password: test/test.
; Ctrl-A requests attention; select sos, then enter run test pass test.
TELNET DEVNO=4 ADDRESS=127.0.0.1 PORT=4004 ATTENTION=CTRL-A
; Additional terminals require a corresponding guest SOS catalog setup.
; DEFINE RC851 DEVNO=5 INTNO=16,15 PROTOCOL=CLASSIC
; TELNET DEVNO=5 ADDRESS=127.0.0.1 PORT=4005 ATTENTION=CTRL-A

; Independent persistent overlays. Never mix them with another base image.
; Keep both sidecars when resuming or backing up a MIPS/TS session.
DEFINE RC433X DEVNO=15 FILE=UNIT0.mipsts OVERLAY=UNIT0.mipsts.overlay
DEFINE RC433X DEVNO=16 FILE=UNIT1.mipsts OVERLAY=UNIT1.mipsts.overlay
DEFINE HOSTFILES DEVNO=63 INTNO=21 ROOT=exchange
; Optional paper-tape devices; no host files mounted by default.
DEFINE READER DEVNO=0 INTNO=9
DEFINE PUNCH DEVNO=1 INTNO=12
