; Sim4000 native configuration
;
; Keywords are case-insensitive. A semicolon starts a comment. Paths use
; Unix syntax and are resolved relative to this file unless they are absolute.

; Minimum and maximum core size in 12-bit halfwords. The emulator currently
; allocates the maximum size. Minimum is raised to 16384; maximum is capped
; at 8388607 by the retained configuration policy, not the full 24-bit space.
CORESIZE=0,1048576

; IX index instruction (opcode 61), enabled by default for supplied software.
; This is not a full RC8000 CPU profile. --ix and --no-ix override this setting.
CPU IX=YES
; CPU IX=NO

; Monitor image loaded at the top half of core store.
MONITOR FILE=MONITOR

; Control-E suspends RC4000 execution and opens the sim4000> command prompt.
; CTRL-@ through CTRL-_ are accepted. NONE disables the in-band escape.
OPERATOR ESCAPE=CTRL-E
; OPERATOR ESCAPE=NONE

; Alt-D inserts the translated host date at the active RC console. ALT-A
; through ALT-Z are accepted. NONE disables this optional terminal shortcut;
; the send-date operator command remains available.
OPERATOR DATE=ALT-D
; OPERATOR DATE=NONE

; Map the DEL byte normally generated by modern Backspace keys to Control-H,
; which is the erase character expected by the RC console software. NONE
; passes DEL through unchanged.
INPUT DEL=CTRL-H
; INPUT DEL=NONE

; Offset applied to the host year by Alt-D and send-date. The supplied monitor
; accepts years 1982 through 1999, so -40 maps host year 2026 to 1986.
DATE YEAROFFSET=-40

; Interactive run/continue/autostart pacing. CPU percentages budget one host
; CPU using process CPU time; they do not mean a fraction of RC4000 speed.
; ORIGINAL approximates 250000 instructions/s (nominal 4 us per instruction),
; not cycle-exact hardware timing. IPS limits count actual RC instructions,
; including AM prefixes. Step/trace and bounded --run tests are not paced.
THROTTLE VALUE=50%
; THROTTLE VALUE=ORIGINAL
; THROTTLE VALUE=250000IPS
; THROTTLE VALUE=OFF

; Implemented interval clock and basic console devices. INTNO gives interrupt
; levels; a console has separate I/O and operator-interrupt levels.
DEFINE CONSOLE DEVNO=2  INTNO=6,3
DEFINE CLOCK   DEVNO=3  INTNO=11
DEFINE CONSOLE DEVNO=4  INTNO=20,19

; All supplied monitors include the RC610 printer on device 7, interrupt 10.
; Output starts automatically and appends across restarts, never truncating.
; APPEND=NO requires a new file instead. To switch output: detach 7, then
; attach 7 NEW_FILE (exclusive) or attach 7 FILE append (append).
; Every completed print is flushed immediately, including CR, VT and FF.
DEFINE RC610 DEVNO=7 INTNO=10 FILE=printer.txt APPEND=YES

; Optional Telnet endpoints use an ANSI/VT100-compatible data connection.
; They must follow the corresponding DEFINE line. The primary console on
; device 2 remains local. Bind to loopback unless remote access is intended.
; Control-A requests RC attention without entering the Telnet client command
; mode. ATTENTION=CONNECT requests it on each new connection; NONE disables
; the in-band shortcut. Telnet BRK remains supported in every mode.
; TELNET DEVNO=4 ADDRESS=127.0.0.1 PORT=4004 ATTENTION=CTRL-A

; Terminals default to PROTOCOL=CLASSIC; keep this for the supplied monitor.
; PROTOCOL=V2 opts a single CONSOLE or RC851 into experimental V2 guest
; attributes, input tables and prompt output. It does not change the CPU,
; install a new monitor, or enable interrupt expanders. Use a separate test cfg.
; Add PROTOCOL=V2 to the selected definition, not a duplicate device line.
; Example additional test terminal (requires compatible guest software):
; DEFINE CONSOLE DEVNO=8 INTNO=14,13 PROTOCOL=V2
; TELNET DEVNO=8 ADDRESS=127.0.0.1 PORT=4008 ATTENTION=CTRL-A

; RC851 screen terminals translate their cursor and erase controls to
; ANSI/VT100. Each device uses its own Telnet port.
; DEFINE RC851 DEVNO=5  INTNO=16,15
; TELNET DEVNO=5 ADDRESS=127.0.0.1 PORT=4005 ATTENTION=CTRL-A
; DEFINE RC851 DEVNO=6  INTNO=14,13
; TELNET DEVNO=6 ADDRESS=127.0.0.1 PORT=4006 ATTENTION=CTRL-A

; The safe default opens the RC433X base image read-only. Writes use a volatile
; copy-on-write overlay which is discarded when sim4000 exits.
; UNIT0 contains the native fromhost/tohost tools. To use the historical
; programs instead, select FILE=UNIT0.original or --disk UNIT0.original.
DEFINE RC433X  DEVNO=15 FILE=UNIT0
; To retain writes across restarts, replace the line above with this form.
; The sidecar is validated against the base image before it is loaded.
; DEFINE RC433X  DEVNO=15 FILE=UNIT0 OVERLAY=UNIT0.overlay
; Direct writes require a disposable, verified working copy. Never make the
; checked-in UNIT0 fixture writable. See repository doc/impl/DISK_WORKFLOW.md.
; DEFINE RC433X  DEVNO=15 FILE=work/UNIT0.test WRITABLE=YES

; The reader is available without a mounted tape. Add FILE=path to mount a raw
; 8-bit paper-tape image at startup, or use "attach 0 path" interactively.
DEFINE READER  DEVNO=0  INTNO=9

; The punch is available without an output tape. Use "attach 1 path" to create
; a new raw tape file, or add "replace" explicitly to overwrite an old file.
; FILE=path may create a new output file at startup but never replaces one.
DEFINE PUNCH   DEVNO=1  INTNO=12

; Optional read-only RC749 magnetic tape in tagged TAP format (not paper tape).
; FILE mounts a tape at startup; omit it to use "attach 16 path" later.
; ROOT optionally permits guest-requested mounts beneath this directory.
; Omit ROOT to disable guest mounts. Paths are relative to this config file.
; DEFINE RC749 DEVNO=16 INTNO=11 FILE=tapes/software.tap ROOT=tapes

; Host-file exchange for the native fromhost/tohost RC4000 utilities.
; CMake creates the runtime exchange directory. ROOT is relative to this
; configuration file; guest filenames are relative Unix paths beneath ROOT.
; Symlinks, absolute paths and traversal are rejected. Exports create new
; files exclusively; text output uses LF and binary output preserves bytes.
DEFINE HOSTFILES DEVNO=63 INTNO=21 ROOT=exchange
; Disable this line to turn off host-file exchange.
