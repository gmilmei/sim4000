; Source-built protected RC4000 monitor and matching software profile.
; Keep these files separate from the default compatibility monitor and disk.
; Paths are relative to this configuration, not the current working directory.
PROTECTION MODE=RC4000
CPU IX=YES
CORESIZE=0,1048576
MONITOR FILE=MONITOR.protected

; Control-E enters the emulator CLI; Alt-D inserts a translated host date.
OPERATOR ESCAPE=CTRL-E
OPERATOR DATE=ALT-D
INPUT DEL=CTRL-H
; The monitor accepts historical years; 2026 - 40 gives 1986.
DATE YEAROFFSET=-40
; Budget half of one host CPU during interactive run/continue.
THROTTLE VALUE=50%
; THROTTLE VALUE=ORIGINAL
; THROTTLE VALUE=OFF

; Both profiles use CLASSIC guest terminal protocols, not a V2 monitor.
DEFINE CONSOLE DEVNO=2 INTNO=6,3 PROTOCOL=CLASSIC
DEFINE CLOCK DEVNO=3 INTNO=11
; Printer output is automatic and appends across restarts (never truncates).
DEFINE RC610 DEVNO=7 INTNO=10 FILE=printer.protected.txt APPEND=YES
DEFINE CONSOLE DEVNO=4 INTNO=20,19 PROTOCOL=CLASSIC
; Optional independent remote terminal. Telnet has no authentication/encryption.
; TELNET DEVNO=4 ADDRESS=127.0.0.1 PORT=4004 ATTENTION=CTRL-A
; DEFINE RC851 DEVNO=5 INTNO=16,15 PROTOCOL=CLASSIC
; TELNET DEVNO=5 ADDRESS=127.0.0.1 PORT=4005 ATTENTION=CTRL-A

; Read-only base disk; writes use a volatile overlay and disappear on exit.
; For persistent writes append OVERLAY=UNIT0.protected.overlay to this line.
; Never reuse the compatibility profile's overlay or substitute its base disk.
DEFINE RC433X DEVNO=15 FILE=UNIT0.protected
DEFINE READER DEVNO=0 INTNO=9
DEFINE PUNCH DEVNO=1 INTNO=12
; Optional read-only magnetic tape; startup and software paths are not certified.
; DEFINE RC749 DEVNO=16 INTNO=11 FILE=tapes/software.tap ROOT=tapes

; Use rcin/rcout in protected FP sessions, not the installed fromhost/tohost.
; Example: sample=rcin input, then output=rcout sample.
; Place input in exchange; exports create new files exclusively.
DEFINE HOSTFILES DEVNO=63 INTNO=21 ROOT=exchange
